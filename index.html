<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Field Guide</title>
<style>
:root{--bg:#fbf6ef;--ink:#2b2118;--accent:#b5562b;--card:#fff;--muted:#7a6a5c;--err:#a11b1b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px 0 40px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:20px;margin:6px 0}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin:12px 0}
button{font:inherit;font-size:18px;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;width:100%;margin:6px 0;cursor:pointer;text-align:left}
button.center-btn{text-align:center}
button.secondary{background:#e9dfd3;color:var(--ink)}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);text-align:center}
button:disabled{opacity:.4;cursor:default}
textarea,input{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid #d9cbbb;border-radius:10px;background:#fff;margin:6px 0 12px}
label{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.muted{color:var(--muted);font-size:15px;margin:6px 0}
.center{text-align:center}
.tag{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.big{font-size:24px;font-weight:700;text-align:center;padding:14px 8px;line-height:1.25;word-wrap:break-word}
.final{font-size:20px;font-weight:700;text-align:center;margin:12px 0}
.score{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:8px 0;border-bottom:1px solid #eee}
.row{display:flex;gap:8px}
.row>button{flex:1;text-align:center}
ul.plist{list-style:none;padding:0;margin:0 0 8px}
ul.plist li{padding:6px 0;border-bottom:1px solid #eee}
#flash{color:var(--err);min-height:1.3em;font-size:15px;text-align:center}
.version{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 8px;opacity:.8}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<p id="flash"></p>

// One set of questions per age group, in AGE_BANDS order. Every set has the same 12 topics.
const QUESTIONS_BY_BAND = [KIDS_QS, QUESTIONS, YOUNG_QS, ADULT_QS, MIDDLE_QS, SENIOR_QS];
function qFor(band, t){ return QUESTIONS_BY_BAND[band][t]; }

const NONE_LABEL = "None of the above";
const NONE_CLUE = "says none of the usual options fit them";

// Would You Rather dilemmas for Chapter 3
const WYR = [
  { a: "A road trip", b: "A cruise" },
  { a: "Breakfast for dinner", b: "Dinner for breakfast" },
  { a: "The beach", b: "The mountains" },
  { a: "Board games", b: "Movie night" },
  { a: "Hot cocoa", b: "Iced tea" },
  { a: "Early bird", b: "Night owl" },
  { a: "A dance party", b: "A quiet picnic" },
  { a: "Cook a feast", b: "Order takeout" }
];

const CHAPTERS = { 1: "Who Is This?", 2: "How Well Do You Know Me?", 3: "Would You Rather", 4: "Showdown" };
const LADDER_POINTS = [3, 2, 1];   // points for a right guess at clue 1, 2, or 3
const LADDER_WRONG = -1;           // a wrong ladder guess
const STEP_MS = 15000;             // each ladder clue appears 15 seconds after the last
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const APP_VERSION = "4.3.0";
const APP_BUILD = "2026-11-19";
document.getElementById("version").textContent = "Family Field Guide v" + APP_VERSION + " · build " + APP_BUILD;

let G = null;           // { id, code, version, state }
let isHost = false;
let me = null;          // this phone's player id
let channel = null;
let lastHtml = "";
let draft = [];         // questionnaire answers being chosen on this phone (one array of picks per question)
let qStep = 0;          // which questionnaire question is showing
let betDraft = 1;       // bet chosen for the next guess on this phone
let doubleDraft = false;// whether this phone will use Double on the next vote
let renderedStep = 0;   // last ladder clue shown on this phone

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname = (s, pid) => (s.players.find(p => p.id === pid) || {}).name || "?";
const pnum = (s, pid) => (s.players.find(p => p.id === pid) || {}).num;
const holders = s => s.players.filter(p => p.answers);
const pts = (s, pid) => (s.players.find(p => p.id === pid) || {}).points || 0;

// True only when every question has at least one pick. Checks each index, so empty slots count as unanswered.
function allAnswered(d){
  for (let i = 0; i < QUESTIONS.length; i++){
    if (!Array.isArray(d[i]) || d[i].length === 0) return false;
  }
  return true;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function makeCode(){
  let c = "";
  for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}
function say(text){
  $("flash").textContent = text;
  setTimeout(() => { if ($("flash").textContent === text) $("flash").textContent = ""; }, 4000);
}
function ident(code){ try { return JSON.parse(localStorage.getItem("ffg:" + code) || "{}"); } catch(e){ return {}; } }
function saveIdent(code, obj){ localStorage.setItem("ffg:" + code, JSON.stringify(obj)); }

/* ---------- data layer ---------- */

async function openGame(code, host){
  const { data, error } = await sb.from("games").select("*").eq("code", code.trim().toUpperCase()).maybeSingle();
  if (error || !data){ say("No game found with that code."); return false; }
  G = { id: data.id, code: data.code, version: data.version, state: data.state };
  const id = ident(G.code);
  isHost = host || !!id.host;
  me = id.me || null;
  saveIdent(G.code, { ...id, host: isHost });
  subscribe();
  history.replaceState(null, "", "?code=" + G.code);
  render();
  return true;
}

function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("game-" + G.id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "games", filter: "id=eq." + G.id },
        payload => applyRow(payload.new))
    .subscribe();
}

function applyRow(row){
  if (!G || row.id !== G.id || row.version <= G.version) return;
  G.version = row.version;
  G.state = row.state;
  render();
}

async function refreshGame(){
  if (!G) return;
  const { data } = await sb.from("games").select("*").eq("id", G.id).maybeSingle();
  if (data) applyRow(data);
}

// Apply a change to the shared state. fn may return false to cancel.
// The version check stops two phones from overwriting each other's changes.
async function mutate(fn){
  for (let attempt = 0; attempt < 6; attempt++){
    const { data: cur, error } = await sb.from("games").select("*").eq("id", G.id).single();
    if (error) throw error;
    const state = structuredClone(cur.state);
    if (fn(state) === false){ applyRow(cur); return false; }
    const { data, error: upErr } = await sb.from("games")
      .update({ state, version: cur.version + 1, updated_at: new Date().toISOString() })
      .eq("id", cur.id).eq("version", cur.version).select();
    if (upErr) throw upErr;
    if (data && data.length){ applyRow(data[0]); return true; }
  }
  throw new Error("Too many changes at once. Please try again.");
}

setInterval(refreshGame, 4000); // backup in case realtime drops

/* ---------- game logic ---------- */

// Who may vote on the current item
function eligible(s, item){
  let pool = s.players.filter(p => p.claimed);
  if (item.ch === 4) pool = pool.filter(p => s.finalists.includes(p.id));
  // The person being described may guess too; a self-guess scores 0 (see revealItem).
  return pool.map(p => p.id);
}
// Which clue step is showing for a ladder item (1, 2, or 3)
function ladderStep(s){
  const elapsed = Date.now() - s.startedAt;
  return Math.min(3, Math.floor(elapsed / STEP_MS) + 1);
}
// The clue text for step k of a ladder. opts[k] is the option the target picked (or "none").
function clueFor(s, item, k){
  const qi = item.qs[k], opt = item.opts[k];
  const tb = s.players.find(p => p.id === item.target).band;
  const Q = qFor(tb, qi);
  if (opt === Q.options.length) return NONE_CLUE;
  return Q.options[opt].clue;
}
// Labels for a guess question, including "None of the above" as the last choice
function guessLabels(band, qi){
  return [...qFor(band, qi).options.map(o => o.label), NONE_LABEL];
}
// The option indexes the target picked for a guess item (one or more)
function guessAnswer(s, item){
  return s.players.find(p => p.id === item.target).answers[item.q];
}
function guessCorrect(s, item, choice){
  return guessAnswer(s, item).includes(choice);
}
// Points for one vote on a ladder or guess item (before Double and multiplier)
function baseDelta(s, item, v){
  if (item.kind === "ladder"){
    return v.choice === item.target ? LADDER_POINTS[v.step - 1] : LADDER_WRONG;
  }
  return guessCorrect(s, item, v.choice) ? v.bet : -v.bet;
}
// Scores the current item and marks it revealed. Runs inside a mutate().
function revealItem(s){
  if (s.revealed) return;
  s.revealed = true;
  const item = s.items[s.idx];
  const votes = Object.entries(s.votes);
  const base = {};
  if (item.kind === "wyr"){
    const c = [0, 0];
    votes.forEach(([, v]) => c[v.choice] += 1);
    const majority = c[0] === c[1] ? null : (c[0] > c[1] ? 0 : 1);
    votes.forEach(([pid, v]) => { base[pid] = majority !== null && v.choice === majority ? 1 : 0; });
  } else {
    // Guessing about yourself is allowed but never scores.
    votes.forEach(([pid, v]) => { base[pid] = pid === item.target ? 0 : baseDelta(s, item, v); });
  }
  s.lastDelta = {};
  votes.forEach(([pid, v]) => {
    const d = base[pid] * (v.double ? 2 : 1) * (item.mult || 1);
    const p = s.players.find(x => x.id === pid);
    p.points = (p.points || 0) + d;
    s.lastDelta[pid] = d;
  });
}
// Scores the round, keeps its result for display, and moves to the next item.
// Runs inside a mutate(). Called when everyone who can vote has voted, or when the host moves on.
function advance(s){
  revealItem(s);
  s.prev = { item: s.items[s.idx], votes: JSON.parse(JSON.stringify(s.votes)), delta: { ...s.lastDelta } };
  if (s.idx + 1 >= s.items.length){ s.phase = "final"; return; }
  const cur = s.items[s.idx];
  s.idx += 1;
  s.votes = {};
  s.hidden = {};
  s.revealed = false;
  s.lastDelta = {};
  if (s.items[s.idx].ch !== cur.ch){ s.phase = "break"; return; }
  s.startedAt = Date.now();
}
// One option the target picked for a question, chosen at random when the game starts
function pickOpt(s, target, qi){
  const sel = s.players.find(p => p.id === target).answers[qi];
  return sel[Math.floor(Math.random() * sel.length)];
}
// Builds the full run of items for all four chapters
function buildItems(s){
  const hs = shuffle(holders(s).map(p => p.id));
  const perms = {};
  hs.forEach(id => perms[id] = shuffle([...Array(QUESTIONS.length).keys()]));
  const ch1 = [], ch2 = [];
  hs.forEach(id => {
    const pm = perms[id];
    const a = pm.slice(0, 3), b = pm.slice(3, 6);
    ch1.push({ ch: 1, kind: "ladder", target: id, qs: a, opts: a.map(qi => pickOpt(s, id, qi)), mult: 1 });
    ch1.push({ ch: 1, kind: "ladder", target: id, qs: b, opts: b.map(qi => pickOpt(s, id, qi)), mult: 1 });
    ch2.push({ ch: 2, kind: "guess", target: id, q: pm[6], mult: 1 });
    ch2.push({ ch: 2, kind: "guess", target: id, q: pm[7], mult: 1 });
  });
  const ch3 = shuffle([...Array(WYR.length).keys()]).map(d => ({ ch: 3, kind: "wyr", dilemma: d, mult: 1 }));
  const ch4 = hs.slice(0, 3).map(id => {
    const qs = shuffle([...Array(QUESTIONS.length).keys()]).slice(0, 3);
    return { ch: 4, kind: "ladder", target: id, qs, opts: qs.map(qi => pickOpt(s, id, qi)), mult: 2 };
  });
  return [...shuffle(ch1), ...shuffle(ch2), ...shuffle(ch3), ...ch4];
}

/* ---------- rendering ---------- */

function render(){
  const html = G ? renderGame() : renderHome();
  if (html !== lastHtml){
    $("app").innerHTML = html;
    lastHtml = html;
  }
}

function renderHome(){
  return `
    <h1>Family Field Guide</h1>
    <p class="muted">Everyone plays on their own phone. One person hosts and shares the code.</p>
    <div class="card">
      <h2>Host a game</h2>
      <label for="names">Player names, one per line (at least 3)</label>
      <textarea id="names" rows="8"></textarea>
      <button class="center-btn" data-act="create">Create game</button>
    </div>
    <div class="card">
      <h2>Join a game</h2>
      <label for="code">Game code</label>
      <input id="code" maxlength="6" autocapitalize="characters" autocomplete="off">
      <button class="secondary center-btn" data-act="join">Join</button>
    </div>`;
}

function renderGame(){
  const s = G.state;
  const who = me ? ` · You are ${esc(pname(s, me))}` : "";
  const header = `<p class="tag">Game code <strong>${esc(G.code)}</strong>${isHost ? " · host" : ""}${who}</p>`;
  let body = "";
  if (s.phase === "lobby") body = renderLobby(s);
  else if (s.phase === "questionnaire") body = renderQuestionnaire(s);
  else if (s.phase === "play") body = renderPlay(s);
  else if (s.phase === "break") body = renderBreak(s);
  else if (s.phase === "final") body = renderFinal(s);
  return header + body + `<button class="ghost" data-act="leave">Leave game on this phone</button>`;
}

function claimList(s){
  const open = s.players.filter(p => !p.claimed);
  if (!open.length) return `<p class="muted">Everyone has picked a name.</p>`;
  return `<p class="muted">Tap your name.</p>` +
    open.map(p => `<button class="secondary" data-act="claim" data-pid="${esc(p.id)}">I'm ${esc(p.name)}</button>`).join("");
}

function scoresBox(s){
  const sorted = s.players.slice().sort((a, b) => (b.points || 0) - (a.points || 0));
  return `<div class="card"><p class="tag">Scores</p>` + sorted.map(p =>
    `<div class="score"><span>${p.num ? p.num + ". " : ""}${esc(p.name)}</span><strong>${p.points || 0}</strong></div>`
  ).join("") + `</div>`;
}

function renderLobby(s){
  const list = s.players.map(p =>
    `<li>${esc(p.name)} ${p.claimed ? "✓ joined" : '<span class="muted">not joined yet</span>'}</li>`).join("");
  const meBlock = me
    ? `<p class="muted">Waiting for everyone to join.</p>`
    : `<h2>Who are you?</h2>${claimList(s)}`;
  const hostPart = isHost
    ? `<button class="center-btn" data-act="start-questionnaire" ${s.players.length < 3 ? "disabled" : ""}>Start the questionnaire</button>`
    : "";
  return `<div class="card"><h2>Lobby</h2><ul class="plist">${list}</ul>${meBlock}${hostPart}</div>`;
}

function ageCard(){
  return `<div class="card"><p class="tag">Before you start</p><h2>How old are you?</h2>
    <p class="muted">Your age group decides which version of each question you get.</p>` +
    AGE_BANDS.map((b, i) => `<button class="secondary" data-act="set-age" data-band="${i}">${esc(b.label)}</button>`).join("") +
    `</div>`;
}
function questionCard(band){
  const Q = qFor(band, qStep);
  const none = Q.options.length;
  const sel = draft[qStep] || [];
  const complete = allAnswered(draft);
  const last = qStep === QUESTIONS.length - 1;
  const opts = Q.options.map((o, oi) =>
    `<button class="${sel.includes(oi) ? "" : "secondary"}" data-act="toggle" data-o="${oi}">${sel.includes(oi) ? "✓ " : ""}${esc(o.label)}</button>`).join("")
    + `<button class="${sel.includes(none) ? "" : "secondary"}" data-act="toggle" data-o="none">${sel.includes(none) ? "✓ " : ""}${NONE_LABEL}</button>`;
  const nav = last
    ? `<button class="center-btn" data-act="save-answers" ${complete ? "" : "disabled"}>Save my answers</button>`
    : `<button class="center-btn" data-act="qnext" ${sel.length === 0 ? "disabled" : ""}>Next</button>`;
  return `<div class="card">
    <p class="tag">Questionnaire · ${qStep + 1} of ${QUESTIONS.length}</p>
    <h2>${esc(Q.q)}</h2>
    <p class="muted">Tap every answer that fits you. "None of the above" clears the others.</p>
    ${opts}
    <div class="row">
      <button class="secondary center-btn" data-act="qprev" ${qStep === 0 ? "disabled" : ""}>Back</button>
      ${nav}
    </div></div>`;
}

function renderQuestionnaire(s){
  const total = s.players.length;
  const done = s.players.filter(p => p.answers).length;
  let mine;
  if (!me){
    mine = `<div class="card"><h2>Who are you?</h2>${claimList(s)}</div>`;
  } else {
    const p = s.players.find(x => x.id === me);
    if (p && p.answers){
      mine = `<div class="card"><h2>Answers saved</h2><p class="muted">Waiting for the others. ${done} of ${total} done.</p></div>`;
    } else if (p && (p.band === null || p.band === undefined)){
      mine = ageCard();
    } else {
      mine = questionCard(p.band) + `<button class="ghost center-btn" data-act="reset-age">Change my age group</button>`;
    }
  }
  const progress = s.players.map(p =>
    `<li>${esc(p.name)} ${p.answers ? "✓ done" : '<span class="muted">answering</span>'}</li>`).join("");
  const hostPart = isHost
    ? `<div class="card"><h2>Questionnaire progress</h2>
        <p class="muted">${done} of ${total} done. Anyone who hasn't finished sits out the game.</p>
        <ul class="plist">${progress}</ul>
        <button class="center-btn" data-act="start-game" ${done < 3 ? "disabled" : ""}>Start the game</button></div>`
    : "";
  return mine + hostPart;
}

function powersLine(s){
  if (!me) return "";
  const p = s.players.find(x => x.id === me);
  if (!p || !p.powers) return "";
  return `<p class="muted center">Your powers: Double ×${p.powers.double}, Lifeline ×${p.powers.lifeline}</p>`;
}

function renderPlay(s){
  const item = s.items[s.idx];
  const inChapter = s.items.filter(i => i.ch === item.ch);
  const pos = s.items.slice(0, s.idx + 1).filter(i => i.ch === item.ch).length;
  const head = `<p class="tag">Chapter ${item.ch} · ${CHAPTERS[item.ch]} · ${pos} of ${inChapter.length}</p>`;
  const voters = eligible(s, item);
  const votesIn = voters.filter(id => s.votes[id] !== undefined).length;
  const myVote = me ? s.votes[me] : undefined;
  const canVote = !!me && voters.includes(me) && myVote === undefined && !s.revealed;
  const me_p = me ? s.players.find(x => x.id === me) : null;
  const doubleLeft = me_p && me_p.powers ? me_p.powers.double : 0;
  const lifeLeft = me_p && me_p.powers ? me_p.powers.lifeline : 0;
  const hiddenOpts = (me && s.hidden && s.hidden[me]) || [];
  let prompt = "", choices = "", extra = "";

  if (item.kind === "ladder"){
    const step = ladderStep(s);
    renderedStep = step;
    const clues = [];
    for (let k = 0; k < step; k++){
      clues.push(`<p class="big" style="font-size:20px;padding:6px 0">Clue ${k + 1}: Which person ${esc(clueFor(s, item, k))}?</p>`);
    }
    prompt = clues.join("") + `<p class="muted center">Clue ${step} of 3</p>
      <p class="muted center">Right now: ${LADDER_POINTS[step - 1] * item.mult} if right, ${LADDER_WRONG * item.mult} if wrong.</p>`;
    if (canVote){
      choices = holders(s).map(p =>
        `<button class="secondary" data-act="vote" data-v="${esc(p.id)}">${p.num}. ${esc(p.name)}</button>`).join("");
    }
  } else if (item.kind === "guess"){
    const tp = s.players.find(p => p.id === item.target);
    prompt = `<p class="tag center">About ${esc(tp.name)}</p><p class="big">${esc(qFor(tp.band, item.q).q)}</p>
      <p class="muted center">Which answer did ${esc(tp.name)} pick? Their answer may be more than one.</p>`;
    if (canVote){
      const bets = [1, 2, 3].map(b =>
        `<button class="${betDraft === b ? "" : "secondary"} center-btn" data-act="bet" data-b="${b}">Bet ${b}</button>`).join("");
      extra = `<div class="row">${bets}</div>`;
      choices = guessLabels(tp.band, item.q).map((lab, k) => hiddenOpts.includes(k) ? "" :
        `<button class="secondary" data-act="vote" data-v="${k}">${k + 1}. ${esc(lab)}</button>`).join("");
      if (lifeLeft > 0 && hiddenOpts.length === 0)
        extra += `<button class="secondary center-btn" data-act="lifeline">Lifeline: remove up to two wrong answers</button>`;
    }
  } else {
    const d = WYR[item.dilemma];
    prompt = `<p class="tag center">Would you rather</p><p class="big">${esc(d.a)} or ${esc(d.b)}?</p>`;
    if (canVote){
      choices = `<button class="secondary" data-act="vote" data-v="0">A · ${esc(d.a)}</button>
        <button class="secondary" data-act="vote" data-v="1">B · ${esc(d.b)}</button>`;
    }
  }

  if (canVote && doubleLeft > 0){
    extra += `<button class="${doubleDraft ? "" : "secondary"} center-btn" data-act="toggle-double">Double on this vote: ${doubleDraft ? "on" : "off"} (${doubleLeft} left)</button>`;
  }

  if (canVote && item.target === me){
    extra = `<p class="muted center">This one is about you. You can still guess, but a guess about yourself scores 0.</p>` + extra;
  }

  let body;
  if (canVote){
    body = extra + choices;
  } else if (myVote !== undefined){
    body = `<p class="muted center">Your pick is in. Waiting for ${voters.length - votesIn} more.</p>`;
  } else {
    body = `<p class="muted center">Waiting for ${voters.length - votesIn} more to vote.</p>`;
  }

  let host = "";
  if (isHost){
    host = `<button class="ghost center-btn" data-act="skip">Move on now</button>`;
  }

  return `${prevBlock(s)}<div class="card">${head}${prompt}${body}${host}</div>${powersLine(s)}${scoresBox(s)}`;
}

function revealBlock(s, item, votes, delta){
  let answer;
  if (item.kind === "ladder"){
    const tp = s.players.find(p => p.id === item.target);
    answer = `It was: ${tp.num}. ${tp.name}`;
  } else if (item.kind === "guess"){
    const labels = guessLabels(s.players.find(p => p.id === item.target).band, item.q);
    answer = `It was: ${guessAnswer(s, item).map(k => labels[k]).join(" and ")}`;
  } else {
    const c = [0, 0];
    Object.values(votes).forEach(v => c[v.choice] += 1);
    const d = WYR[item.dilemma];
    answer = c[0] === c[1] ? "A tie, so nobody scores" : `Majority: ${c[0] > c[1] ? d.a : d.b}`;
  }
  const rows = Object.entries(delta || {}).map(([pid, d]) =>
    `<div class="score"><span>${esc(pname(s, pid))}</span><strong>${d > 0 ? "+" + d : d}</strong></div>`).join("")
    || `<p class="muted center">No votes this round.</p>`;
  return `<p class="final">${esc(answer)}</p>${rows}`;
}
// Result of the round just finished, shown above the next one.
function prevBlock(s){
  const p = s.prev;
  if (!p) return "";
  return `<div class="card"><p class="tag">Last round · Chapter ${p.item.ch}</p>${revealBlock(s, p.item, p.votes, p.delta)}</div>`;
}

function renderBreak(s){
  const nextIt = s.items[s.idx];
  const top = s.players.filter(p => p.answers).slice().sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 3);
  const note = nextIt.ch === 4
    ? `<p class="muted center">Showdown: the top three by score compete. Right now: ${esc(top.map(p => p.name).join(", "))}</p>`
    : "";
  const host = isHost
    ? `<button class="center-btn" data-act="continue">Start Chapter ${nextIt.ch}: ${esc(CHAPTERS[nextIt.ch])}</button>`
    : `<p class="muted center">Waiting for the host to start the next chapter.</p>`;
  return `${prevBlock(s)}<div class="card"><p class="tag">Break</p><p class="big">Chapter ${nextIt.ch}: ${esc(CHAPTERS[nextIt.ch])}</p>${note}${host}</div>${scoresBox(s)}`;
}

function renderFinal(s){
  const top = Math.max(...s.players.map(p => p.points || 0));
  const leaders = s.players.filter(p => (p.points || 0) === top);
  const headline = leaders.length === 1 ? `${esc(leaders[0].name)} wins!`
    : "Tie: " + esc(leaders.map(p => p.name).join(" and "));
  return `<div class="card"><div class="final">${headline}</div><p class="muted center">Final score: ${top}</p></div>
    ${scoresBox(s)}`;
}

/* ---------- timer: keeps the ladder clock and closes expired ladders ---------- */

function tick(){
  if (!G) return;
  const s = G.state;
  if (s.phase !== "play") return;
  const item = s.items[s.idx];
  if (!item || item.kind !== "ladder") return;
  // Only the clue steps change with time. Nothing closes or moves on by timer.
  const step = ladderStep(s);
  if (step !== renderedStep){
    renderedStep = step;
    render();
  }
}
setInterval(tick, 500);

/* ---------- actions ---------- */

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  try {
    await handle(b.dataset.act, b);
  } catch (err){
    say("Something went wrong: " + err.message);
  } finally {
    render();
  }
});

async function handle(act, b){
  switch (act){
    case "create": {
      const names = $("names").value.split("\n").map(x => x.trim()).filter(Boolean);
      if (names.length < 3) return say("Please enter at least 3 names.");
      const code = makeCode();
      const state = {
        phase: "lobby",
        players: names.map((name, i) => ({ id: "p" + i, name, claimed: false, num: null, answers: null, band: null, points: 0, powers: null })),
        items: [], idx: 0, startedAt: 0, votes: {}, hidden: {}, revealed: false, lastDelta: {}, finalists: []
      };
      const { error } = await sb.from("games").insert({ code, state, version: 1 });
      if (error) return say("Could not create the game: " + error.message);
      await openGame(code, true);
      return;
    }
    case "join": {
      const code = $("code").value.trim();
      if (code.length < 4) return say("Enter the game code.");
      await openGame(code, false);
      return;
    }
    case "leave": {
      if (channel) sb.removeChannel(channel);
      channel = null; G = null; isHost = false; me = null;
      history.replaceState(null, "", location.pathname);
      return;
    }
    case "claim": {
      const pid = b.dataset.pid;
      const ok = await mutate(s => {
        const p = s.players.find(x => x.id === pid);
        if (!p || p.claimed) return false;
        p.claimed = true;
      });
      if (ok){
        me = pid;
        saveIdent(G.code, { ...ident(G.code), me });
      } else say("That name was just taken. Pick another.");
      return;
    }
    case "start-questionnaire": {
      if (!isHost) return;
      const ok = await mutate(s => {
        if (s.phase !== "lobby" || s.players.length < 3) return false;
        const ids = shuffle(s.players.map(p => p.id));
        s.players.forEach(p => { p.num = ids.indexOf(p.id) + 1; p.points = 0; p.answers = null; });
        s.phase = "questionnaire";
      });
      if (ok){ draft = new Array(QUESTIONS.length); qStep = 0; }
      return;
    }
    case "toggle": {
      // Tapping an option adds or removes it. "None of the above" clears the others, and any option clears "None".
      const band = G.state.players.find(x => x.id === me).band;
      const none = qFor(band, qStep).options.length;
      const o = b.dataset.o === "none" ? none : Number(b.dataset.o);
      let sel = (draft[qStep] || []).slice();
      if (o === none){
        sel = sel.includes(none) ? [] : [none];
      } else {
        sel = sel.filter(x => x !== none);
        sel = sel.includes(o) ? sel.filter(x => x !== o) : [...sel, o];
      }
      draft[qStep] = sel.sort((x, y) => x - y);
      return;
    }
    case "qnext": {
      qStep = Math.min(QUESTIONS.length - 1, qStep + 1);
      return;
    }
    case "qprev": {
      qStep = Math.max(0, qStep - 1);
      return;
    }
    case "save-answers": {
      if (!allAnswered(draft)) return say("Please answer every question.");
      const answers = draft.map(v => [...v]);
      await mutate(s => {
        const p = s.players.find(x => x.id === me);
        if (!p || p.answers || p.band === null || p.band === undefined || s.phase !== "questionnaire") return false;
        p.answers = answers;
      });
      return;
    }
    case "set-age": {
      const band = Number(b.dataset.band);
      await mutate(s => {
        const p = s.players.find(x => x.id === me);
        if (!p || p.answers || s.phase !== "questionnaire") return false;
        p.band = band;
      });
      return;
    }
    case "reset-age": {
      await mutate(s => {
        const p = s.players.find(x => x.id === me);
        if (!p || p.answers || s.phase !== "questionnaire") return false;
        p.band = null;
      });
      return;
    }
    case "start-game": {
      if (!isHost) return;
      const ok = await mutate(s => {
        if (s.phase !== "questionnaire") return false;
        if (holders(s).length < 3) return false;
        s.players.forEach(p => { p.powers = { double: 1, lifeline: 1 }; p.points = 0; });
        s.items = buildItems(s);
        s.idx = 0;
        s.phase = "play";
        s.votes = {};
        s.hidden = {};
        s.revealed = false;
        s.lastDelta = {};
        s.finalists = [];
        s.startedAt = Date.now();
      });
      if (!ok) say("At least 3 players need to finish the questionnaire.");
      return;
    }
    case "bet": {
      betDraft = Number(b.dataset.b);
      return;
    }
    case "toggle-double": {
      doubleDraft = !doubleDraft;
      return;
    }
    case "lifeline": {
      await mutate(s => {
        const item = s.items[s.idx];
        if (s.phase !== "play" || s.revealed || !me || !item || item.kind !== "guess") return false;
        const p = s.players.find(x => x.id === me);
        if (!p || !p.powers || p.powers.lifeline < 1 || s.votes[me] !== undefined || s.hidden[me]) return false;
        const correct = guessAnswer(s, item);
        const tb = s.players.find(x => x.id === item.target).band;
        const everyChoice = [...Array(qFor(tb, item.q).options.length + 1).keys()];
        const wrong = shuffle(everyChoice.filter(k => !correct.includes(k)));
        s.hidden[me] = wrong.slice(0, 2);
        p.powers.lifeline -= 1;
      });
      return;
    }
    case "vote": {
      const raw = b.dataset.v;
      await mutate(s => {
        if (s.phase !== "play" || s.revealed || !me) return false;
        const item = s.items[s.idx];
        if (!item || s.votes[me] !== undefined || !eligible(s, item).includes(me)) return false;
        const p = s.players.find(x => x.id === me);
        const v = {};
        if (item.kind === "ladder"){ v.choice = raw; v.step = ladderStep(s); }
        else if (item.kind === "guess"){ v.choice = Number(raw); v.bet = betDraft; }
        else { v.choice = Number(raw); }
        if (doubleDraft && p.powers && p.powers.double > 0){ v.double = true; p.powers.double -= 1; }
        s.votes[me] = v;
        if (eligible(s, item).every(id => s.votes[id] !== undefined)) advance(s);
      });
      doubleDraft = false;
      return;
    }
    case "skip": {
      // Host only: score whatever votes are in and move on, for a slow round.
      if (!isHost) return;
      await mutate(s => {
        if (s.phase !== "play") return false;
        advance(s);
      });
      return;
    }
    case "continue": {
      if (!isHost) return;
      await mutate(s => {
        if (s.phase !== "break") return false;
        const next = s.items[s.idx];
        if (next.ch === 4){
          s.finalists = shuffle(holders(s).map(p => p.id))
            .sort((a, b) => pts(s, b) - pts(s, a))
            .slice(0, 3);
        }
        s.phase = "play";
        s.startedAt = Date.now();
      });
      return;
    }
  }
}

/* ---------- start ---------- */

const params = new URLSearchParams(location.search);
if (params.get("code")) openGame(params.get("code"), false);
else render();
</script>
